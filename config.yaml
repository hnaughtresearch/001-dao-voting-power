# H Naught Research 001 · collection config. Frozen values are part of the pre-registration:
# change them only in a new, dated commit (see Amendment 1 in research_design.md).

cutoff_utc: "2026-11-01T00:00:00"   # proposals created before this instant (UTC) are in the study

filters:                            # pre-registered (research_design Section 3.3)
  min_decided: 20                   # decided proposals per DAO (sensitivity: 10, 40)
  min_median_voters: 10             # median voters per decided proposal (sensitivity: 5, 25)
  min_span_days: 365                # first to last decided proposal
  light_min_created_per_governor: 3 # only limits RPC calls in `select`; not a study filter

rpc:
  min_interval_s: 0.1               # polite pacing for free public endpoints

# Logs: Envio HyperSync (free token, env HYPERSYNC_TOKEN). Contract reads: any ordinary RPC at
# the latest block; set the env var to use your own endpoint instead of the public default.
chains:
  ethereum:
    hypersync_url: https://eth.hypersync.xyz
    rpc_env: ETH_RPC_URL
    rpc_default: https://ethereum-rpc.publicnode.com
  arbitrum:
    hypersync_url: https://arbitrum.hypersync.xyz
    rpc_env: ARB_RPC_URL
    rpc_default: https://arb1.arbitrum.io/rpc
  optimism:
    hypersync_url: https://optimism.hypersync.xyz
    rpc_env: OP_RPC_URL
    rpc_default: https://mainnet.optimism.io
